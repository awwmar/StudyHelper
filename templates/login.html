<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudyHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: #fff;
        }

        .split-screen {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-pane {
            flex: 1;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .left-pane img {
            width: 90%;
            max-width: 600px;
            height: auto;
            object-fit: contain;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .right-pane {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: #ffffff;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            display: inline-block;
        }

        .welcome-text {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--secondary);
            margin-bottom: 40px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .role-card {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .role-card:hover {
            border-color: var(--primary);
            background: #eff6ff;
        }

        .role-card.selected {
            border-color: var(--primary);
            background: #eff6ff;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .role-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .role-title {
            font-weight: 600;
            color: #1e293b;
        }

        .login-btn {
            width: 100%;
            background: #fff;
            color: #333;
            border: 1px solid #cbd5e1;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .login-btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            transform: translateY(-1px);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .left-pane {
                display: none;
            }

            .right-pane {
                flex: 1;
                background: #f8fafc;
            }

            .login-card {
                background: #fff;
                border-radius: 16px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            }
        }
    </style>
</head>

<body>
    <div class="split-screen">
        <div class="left-pane">
            <img src="{{ url_for('static', filename='images/login_photo.png') }}" alt="Learning Illustration">
        </div>
        <div class="right-pane">
            <div class="login-card">
                <div class="logo">StudyHub</div>
                <h1 class="welcome-text">Welcome Back</h1>
                <p class="subtitle">Choose your role to continue</p>

                <div class="role-selector">
                    <div class="role-card selected" onclick="selectRole('student', this)">
                        <span class="role-icon">🎓</span>
                        <div class="role-title">Student</div>
                    </div>
                    <div class="role-card" onclick="selectRole('teacher', this)">
                        <span class="role-icon">👨‍🏫</span>
                        <div class="role-title">Teacher</div>
                    </div>
                </div>

                <a id="googleLoginBtn" href="/auth/google?role=student" class="login-btn">
                    <svg class="google-icon" viewBox="0 0 48 48">
                        <path fill="#FFC107"
                            d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00"
                            d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50"
                            d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                        <path fill="#1976D2"
                            d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                    Sign in with Google
                </a>
            </div>
        </div>
    </div>

    <script>
        function selectRole(role, element) {
            // Update UI
            document.querySelectorAll('.role-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');

            // Update Link
            const btn = document.getElementById('googleLoginBtn');
            btn.href = `/auth/google?role=${role}`;
        }
    </script>
</body>

</html>
